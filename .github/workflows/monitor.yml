name: Depot-Überwachung (Alarme)

# Alle 5 Minuten: prüft gespeicherte Alarmregeln gegen aktuelle Kurse/News und verschickt Treffer per
# ntfy. "workflow_dispatch" erlaubt einen manuellen Testlauf über den Actions-Tab.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
